services:
  - type: web
    name: zar-ai
    runtime: node
    plan: starter
    buildCommand: |
      npm install --prefix shared
      npm install --prefix client
      npm run build --prefix client
      npm install --prefix server
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REQUIRE_DATABASE
        value: "true"
      - key: FRONTEND_URL
        value: "https://zar-ai.online"
      - key: VITE_API_BASE_URL
        value: "https://api.zar-ai.online"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: VITE_PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: ZILLION_PROSPER_API_URL
        sync: false
      - key: ZILLION_CAPABILITY_SECRET
        sync: false
      - key: LIGHTNING_API_KEY
        sync: false
      - key: LIGHTNING_BASE_URL
        sync: false
