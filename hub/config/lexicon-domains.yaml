# Lexicon Authority domain manifest.
#
# Extension point for server/services/lexicon-authority/domains.ts —
# add a domain here and it is immediately usable by ResolveTerm,
# SearchDomain, and the Lexicon UI without a code change. `community:
# true` marks a domain as community/cultural language (Ballroom, Black
# Vernacular, Internet Culture, ...) rather than a professional/technical
# field, so the UI and curation review can group them separately.
#
# Removing a domain here does not delete lexicon entries that already
# reference it; it only stops it from being offered going forward.

domains:
