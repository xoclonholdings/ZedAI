model_selection:
  primary: "qwen2.5:7b"
  fallback: "llama3.2"
  vision: "llava-phi3"
  code_generation: "qwen2.5:7b"
  cost_optimized: "phi-2"
  reasoning_heavy: "qwen2.5:7b"

ollama:
  endpoint: "http://localhost:11434"
  timeout_seconds: 120
  max_retries: 3

context_management:
  max_tokens_per_agent: 8192
  summarization_threshold: 0.8
  memory_decay_days: 30
  working_memory_max_items: 50
  episodic_retention_days: 90

performance:
  timeout_seconds: 120
  retry_attempts: 3
  parallel_agent_limit: 4
  request_queue_max: 20

cost_controls:
  monthly_budget_usd: 0
  alert_at_80_percent: true
  hard_stop_at_100_percent: false
  prefer_local_models: true
  local_only_mode: true

agent_routing:
  default_agent: "OperationsAgent"
  research_keywords:
    - "research"
    - "find"
    - "analyze"
    - "trend"
    - "market"
    - "github"
    - "news"
  operations_keywords:
    - "schedule"
    - "email"
    - "calendar"
    - "post"
    - "social"
    - "task"
    - "meeting"
  orchestrator_timeout_seconds: 30

memory_config:
  vector_store: "local"
  embedding_model: "qwen2.5:7b"
  working_memory_path: "./hub/shared-memory/working"
  episodic_memory_path: "./hub/shared-memory/episodic"
  semantic_memory_path: "./hub/shared-memory/semantic"
  consensus_path: "./hub/shared-memory/consensus"
