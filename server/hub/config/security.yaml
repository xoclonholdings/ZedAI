permission_tiers:
  tier_1_read_only:
    description: "Intelligence Agent default — passive data access only"
    allowed:
      - web_search
      - document_read
      - analytics_read
      - local_file_read
      - conversation_history_read
      - github_read
    denied:
      - all_write_operations
      - external_api_calls
      - system_commands

  tier_2_write_limited:
    description: "Operations Agent default — internal writes and draft creation"
    allowed:
      - calendar_write
      - draft_email
      - schedule_social_draft
      - local_file_write
      - task_create
      - memory_write
      - conversation_write
    denied:
      - email_send_live
      - social_post_live
      - financial_operations
      - system_commands

  tier_3_system_access:
    description: "IDE/Audio Agents — requires explicit ADMIN approval per action"
    allowed_with_approval:
      - terminal_execute
      - github_pr_create
      - daw_control
      - system_package_install
      - network_access
      - file_system_write_broad
    auto_denied:
      - production_deployment
      - credential_modification

approval_gates:
  auto_approve_below_cost: "$0.50"
  notify_above_cost: "$5.00"
  require_human_above_cost: "$20.00"

  code_changes:
    auto_merge: false
    pr_review_required: true
    test_pass_required: true

  social_media:
    draft_review: true
    scheduled_posts: true
    live_posts: "require_approval"

  email:
    draft_only: true
    send_internal: "require_approval"
    send_external: "require_approval"

  data_handling:
    local_first: true
    cloud_allowed_for:
      - heavy_compute
      - non_sensitive_research
    encryption_at_rest: true
    retention_days: 90

  pii_handling:
    auto_redact: true
    require_admin_for_pii_access: true
    log_all_pii_requests: true

sensitive_data_rules:
  never_log:
    - passwords
    - api_keys
    - personal_health_information
    - financial_account_details
  always_encrypt:
    - voice_embeddings
    - user_credentials
    - session_tokens
  audit_trail_required:
    - all_external_api_calls
    - all_file_deletions
    - all_admin_actions
    - all_approval_decisions
